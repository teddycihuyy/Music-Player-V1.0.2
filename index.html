<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music Player Beta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif}
body{background:#0a0a0a;color:#fff;overflow:hidden;height:100dvh}
#home{position:absolute;inset:0;background:#0a0a0a;z-index:1;padding:16px;overflow-y:auto;padding-bottom:90px}
#homeHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
#homeHeader h1{font-size:22px;font-weight:800}
.searchBar{display:flex;gap:10px;margin-bottom:20px}
.searchBar input{flex:1;background:#1e1e1e;border:none;border-radius:24px;padding:12px 18px;color:#fff;outline:none}
.searchBar button{background:#fff;color:#000;border:none;border-radius:24px;padding:12px 22px;font-weight:800}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cardHome{background:#161616;border-radius:16px;padding:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.cardHome img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.cardHome h4{font-size:13px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardHome p{font-size:11px;opacity:.5}
#full{position:absolute;inset:0;background:#111 center/cover no-repeat;z-index:10;transform:translateY(100%);transition:.45s cubic-bezier(.32,1,.23,1)}
#full.active{transform:translateY(0)}
#full::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.65) 0%,transparent 40%,rgba(0,0,0,.55) 100%)}
.top{position:absolute;top:0;left:0;right:0;z-index:11;display:flex;justify-content:space-between;align-items:center;padding:22px 16px}
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:11;background:rgba(28,28,30,.58);backdrop-filter:blur(30px);border-radius:32px 32px 0 0;padding:20px 20px 36px}
#seek{width:100%;-webkit-appearance:none;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#fff;border-radius:50%}
</style>
</head>
<body>
<div id="home">
  <div id="homeHeader"><h1>Music Player Beta</h1><i class="fa-solid fa-ellipsis"></i></div>
  <div class="searchBar"><input id="q" placeholder="Cari: Yoasobi, Ado..." value="Yoasobi"><button onclick="search()">Cari</button></div>
  <div id="homeList" class="list"></div>
</div>
<div id="full">
  <div class="top"><i class="fa-solid fa-chevron-down" style="font-size:20px" onclick="closeFull()"></i><div style="font-size:14px"><b style="border-bottom:2px solid #fff;padding-bottom:4px">Song</b><span style="opacity:.4;margin:0 6px">|</span><span style="opacity:.4">Lyrics</span></div><i class="fa-solid fa-ellipsis-vertical"></i></div>
  <div class="bottom">
    <div style="display:flex;justify-content:space-between"><div><h2 id="fTitle" style="font-size:18px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">-</h2><p id="fArtist" style="font-size:12px;opacity:.6">-</p></div><div style="display:flex;gap:16px;font-size:22px"><i class="fa-regular fa-heart"></i><i class="fa-solid fa-list-ul" onclick="closeFull()"></i></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:20px;opacity:.8;font-size:11px"><div style="text-align:center"><i class="fa-solid fa-sliders" style="display:block;font-size:18px;margin-bottom:3px"></i>Timer</div><div style="text-align:center"><i class="fa-solid fa-volume-high" style="display:block;font-size:18px;margin-bottom:3px"></i>EQ</div><div style="text-align:center"><i class="fa-regular fa-clock" style="display:block;font-size:18px;margin-bottom:3px"></i>Sleep</div><div style="text-align:center"><i class="fa-solid fa-gauge" style="display:block;font-size:18px;margin-bottom:3px"></i>1.0x</div><div style="text-align:center"><i class="fa-solid fa-music" style="display:block;font-size:18px;margin-bottom:3px"></i>Lyrics</div></div>
    <div style="margin-top:18px"><div style="display:flex;justify-content:space-between;opacity:.7;font-size:12px;margin-bottom:6px"><span onclick="audio.currentTime-=10"><i class="fa-solid fa-rotate-left"></i> 10</span><span onclick="audio.currentTime+=10">10 <i class="fa-solid fa-rotate-right"></i></span></div><input type="range" id="seek" value="0"><div style="display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:6px"><span id="cur">00:00</span><span id="dur">00:30</span></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:0 8px"><i class="fa-solid fa-shuffle" style="opacity:.5"></i><i class="fa-solid fa-backward-step" style="font-size:22px" onclick="prev()"></i><div id="playBtn" onclick="toggle()" style="width:66px;height:66px;background:#fff;color:#000;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px"><i id="pIcon" class="fa-solid fa-play"></i></div><i class="fa-solid fa-forward-step" style="font-size:22px" onclick="next()"></i><i class="fa-solid fa-repeat" style="opacity:.5"></i></div>
  </div>
</div>
<audio id="audio"></audio>
<script>
const audio=document.getElementById('audio'),seek=document.getElementById('seek'),q=document.getElementById('q'),homeList=document.getElementById('homeList'),full=document.getElementById('full'),fTitle=document.getElementById('fTitle'),fArtist=document.getElementById('fArtist'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),pIcon=document.getElementById('pIcon');
let tracks=[],idx=0;
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function search(){
  let term=q.value||'yoasobi'; homeList.innerHTML='<p style="opacity:.5;text-align:center;margin-top:20px">Loading...</p>';
  let res=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&limit=30`);
  let data=await res.json(); tracks=data.results||[]; homeList.innerHTML='';
  tracks.forEach((t,i)=>{
    let div=document.createElement('div');div.className='cardHome';
    let img=t.artworkUrl100.replace('100x100','300x300');
    div.innerHTML=`<img src="${img}"><div><h4>${t.trackName}</h4><p>${t.artistName}</p></div><i class="fa-solid fa-play" style="margin-left:auto;opacity:.4;font-size:12px"></i>`;
    div.onclick=()=>openFull(i); homeList.appendChild(div);
  });
}
function openFull(i){
  idx=i;let t=tracks[i]; fTitle.textContent=t.trackName; fArtist.textContent=t.artistName;
  full.style.backgroundImage=`url('${t.artworkUrl100.replace('100x100','1000x1000')}')`;
  full.classList.add('active'); audio.src=t.previewUrl; audio.play(); pIcon.className='fa-solid fa-pause';
}
function closeFull(){full.classList.remove('active')}
function toggle(){if(audio.paused){audio.play();pIcon.className='fa-solid fa-pause'}else{audio.pause();pIcon.className='fa-solid fa-play'}}
function next(){idx=(idx+1)%tracks.length;openFull(idx)}
function prev(){idx=(idx-1+tracks.length)%tracks.length;openFull(idx)}
audio.ontimeupdate=()=>{seek.value=audio.duration?audio.currentTime/audio.duration*100:0;cur.textContent=fmt(audio.currentTime);if(audio.duration)dur.textContent=fmt(audio.duration)}
seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration}
audio.onended=()=>next();
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()})
search();
</script>
</body>
</html>
