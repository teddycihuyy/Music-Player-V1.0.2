<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music Player V1.0.3 - Full</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;color:#fff;height:100dvh;overflow:hidden}
#home{position:absolute;inset:0;background:#0a0a0a;padding:16px;overflow-y:auto;padding-bottom:20px}
.cardHome{background:#161616;border-radius:14px;padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer}
.cardHome img{width:54px;height:54px;border-radius:8px;object-fit:cover}
#full{position:fixed;inset:0;z-index:99;background:#000 center/cover no-repeat;transform:translateY(105%);transition:.5s cubic-bezier(.32,1,.23,1)}
#full.active{transform:translateY(0)}
#full::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35)}
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:2;background:rgba(28,28,30,.75);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:32px 32px 0 0;padding:22px 20px 40px;border-top:1px solid rgba(255,255,255,.08)}
#seek{width:100%;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.25);border-radius:10px}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 0 10px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="home">
  <h1 style="font-size:22px;margin-bottom:16px">Music Player V1.0.2</h1>
  <div style="display:flex;gap:8px;margin-bottom:18px"><input id="q" placeholder="Cari: Yoasobi, Ado, Kenshi..." style="flex:1;background:#1e1e1e;border:none;border-radius:24px;padding:12px 16px;color:#fff;outline:none" value="Yoasobi"><button onclick="search()" style="background:#fff;color:#000;border:none;border-radius:24px;padding:12px 20px;font-weight:800">Cari</button></div>
  <div id="list"></div>
</div>

<div id="full">
  <div style="position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;padding:22px 16px"><i class="fa-solid fa-chevron-down" style="font-size:20px;cursor:pointer" onclick="closeFull()"></i><div style="font-size:14px"><b style="border-bottom:2px solid #fff">Song</b></div><i class="fa-solid fa-ellipsis-vertical"></i></div>
  <div class="bottom">
    <div style="display:flex;justify-content:space-between"><div><h2 id="fTitle" style="font-size:18px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">-</h2><p id="fArtist" style="font-size:12px;opacity:.6;margin-top:2px">Full • Original • No Ads</p></div><i class="fa-regular fa-heart" style="font-size:22px"></i></div>
    <div style="display:flex;justify-content:space-between;margin-top:22px;opacity:.8;font-size:11px"><span><i class="fa-solid fa-sliders"></i> Timer</span><span><i class="fa-solid fa-volume-high"></i> EQ</span><span><i class="fa-regular fa-clock"></i> Sleep</span><span><i class="fa-solid fa-gauge"></i> 1.0x</span><span><i class="fa-solid fa-music"></i> Lyrics</span></div>
    <div style="margin-top:20px"><div style="display:flex;justify-content:space-between;opacity:.6;font-size:11px;margin-bottom:8px"><span onclick="audio.currentTime-=10" style="cursor:pointer"><i class="fa-solid fa-rotate-left"></i> 10</span><span onclick="audio.currentTime+=10" style="cursor:pointer">10 <i class="fa-solid fa-rotate-right"></i></span></div><input type="range" id="seek" value="0"><div style="display:flex;justify-content:space-between;font-size:11px;opacity:.5;margin-top:8px"><span id="cur">00:00</span><span id="dur">00:00</span></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px"><i class="fa-solid fa-shuffle" style="opacity:.5"></i><i class="fa-solid fa-backward-step" style="font-size:22px;cursor:pointer" onclick="prev()"></i><div onclick="toggle()" style="width:68px;height:68px;background:#fff;color:#000;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:26px;cursor:pointer"><i id="pIcon" class="fa-solid fa-play"></i></div><i class="fa-solid fa-forward-step" style="font-size:22px;cursor:pointer" onclick="next()"></i><i class="fa-solid fa-repeat" style="opacity:.5"></i></div>
  </div>
</div>
<audio id="audio"></audio>
<script>
const audio=document.getElementById('audio'),seek=document.getElementById('seek'),q=document.getElementById('q'),list=document.getElementById('list'),full=document.getElementById('full'),fTitle=document.getElementById('fTitle'),fArtist=document.getElementById('fArtist'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),pIcon=document.getElementById('pIcon');
let tracks=[],idx=0;
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function search(){
  list.innerHTML='<p style="opacity:.5;text-align:center">Cari lagu original...</p>';
  let res=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q.value)}&media=music&entity=song&limit=25`);
  let data=await res.json(); tracks=data.results; list.innerHTML='';
  tracks.forEach((t,i)=>{
    let d=document.createElement('div');d.className='cardHome';
    d.innerHTML=`<img src="${t.artworkUrl100}"><div><h4 style="font-size:13px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.trackName}</h4><p style="font-size:11px;opacity:.5">${t.artistName}</p></div>`;
    d.onclick=()=>playFull(i); list.appendChild(d);
  });
}
async function playFull(i){
  idx=i; let t=tracks[i];
  fTitle.textContent=t.trackName; fArtist.textContent=t.artistName;
  full.style.backgroundImage=`url('${t.artworkUrl100.replace('100x100','1000x1000')}')`;
  full.classList.add('active');
  // Coba ambil full audio dari Piped (YouTube tanpa iklan)
  try{
    let pipedSearch=await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(t.artistName+' '+t.trackName)}&filter=music_songs`);
    let pipedData=await pipedSearch.json();
    let videoId=pipedData.items?.[0]?.url?.split('v=')[1]||pipedData.items?.[0]?.url?.split('/').pop();
    if(videoId){
      let streamRes=await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
      let streamData=await streamRes.json();
      let audioStream=streamData.audioStreams?.sort((a,b)=>b.bitrate-a.bitrate)[0]?.url;
      if(audioStream){ audio.src=audioStream; audio.play(); pIcon.className='fa-solid fa-pause'; dur.textContent=fmt(streamData.duration||0); return; }
    }
  }catch(e){console.log('Piped gagal, fallback ke preview',e)}
  // Fallback kalau Piped mati -> pakai preview iTunes 30 detik
  audio.src=t.previewUrl; audio.play(); pIcon.className='fa-solid fa-pause';
}
function closeFull(){full.classList.remove('active')}
function toggle(){if(audio.paused){audio.play();pIcon.className='fa-solid fa-pause'}else{audio.pause();pIcon.className='fa-solid fa-play'}}
function next(){playFull((idx+1)%tracks.length)}
function prev(){playFull((idx-1+tracks.length)%tracks.length)}
audio.ontimeupdate=()=>{seek.value=audio.duration?audio.currentTime/audio.duration*100:0;cur.textContent=fmt(audio.currentTime);if(audio.duration)dur.textContent=fmt(audio.duration)}
seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration}
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()})
search();
</script>
</body>
</html>
