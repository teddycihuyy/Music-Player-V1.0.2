<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music V1.0.2 - Ad Aware</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent!important}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
#home{position:absolute;inset:0;background:#000;padding:16px;overflow-y:auto;padding-bottom:155px}
.searchWrap{background:#141414;border-radius:18px;padding:8px 8px 8px 18px;display:flex;align-items:center;margin-bottom:16px}
.searchWrap input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.goBtn{background:#ff1a6a;color:#fff;border:none;border-radius:14px;padding:12px 22px;font-weight:800}
.cardHome{background:#141414;border-radius:14px;padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer}
.cardHome img{width:52px;height:52px;border-radius:10px;object-fit:cover}
#mini{position:fixed;bottom:0;left:0;right:0;background:#111;border-radius:26px 26px 0 0;padding:14px 16px 22px;z-index:5;border-top:1px solid #222}
.miniTop{display:flex;justify-content:space-between;align-items:center}
.miniTop img{width:48px;height:48px;border-radius:10px;background:#222;object-fit:cover}
#miniSeek,#seek{width:100%;-webkit-appearance:none;height:4px;background:#333;border-radius:10px}
#miniSeek::-webkit-slider-thumb,#seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#ff1a6a;border-radius:50%}
.miniCtrl{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 6px}
.miniCtrl i{font-size:19px;opacity:.6;cursor:pointer;width:42px;height:42px;display:flex;justify-content:center;align-items:center;border-radius:50%}
.playPink{width:62px!important;height:62px!important;background:#ff1a6a!important;opacity:1!important;color:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:20px;box-shadow:0 4px 20px rgba(255,26,106,.4);margin:0 6px}
#full{position:fixed;inset:0;z-index:99;transform:translateY(105%);transition:.55s;overflow:hidden;background:#000}
#full.active{transform:translateY(0)}
#bg{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:.6s}
#full.lyrics-mode #bg{filter:blur(22px) brightness(0.45);transform:scale(1.18)}
#full::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.75));z-index:1}
#slider{position:absolute;inset:0;z-index:2;display:flex;width:200%;transition:.45s}
.panel{width:50%;height:100%;position:relative}
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:3;background:rgba(18,18,18,.92);backdrop-filter:blur(30px);border-radius:32px 32px 0 0;padding:20px 20px 36px}
.lyricBox{position:absolute;top:88px;left:16px;right:16px;bottom:325px;padding:20px;overflow-y:auto;white-space:pre-line;line-height:2.2;font-size:14.5px;background:rgba(15,15,15,.55);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:20px}
.lyricBox.ad-mode{background:rgba(255,204,0,0.12);border-color:rgba(255,204,0,0.3);color:#ffea8a}
#adBadge{display:none;background:#ffcc00;color:#000;font-size:10px;font-weight:900;padding:4px 8px;border-radius:6px;margin-left:8px}
#adBadge.show{display:inline-block}
#queue{position:absolute;right:0;top:0;bottom:0;width:86%;background:#111;z-index:10;transform:translateX(100%);transition:.4s;padding:20px;overflow-y:auto}
#queue.active{transform:translateX(0)}
</style>
</head>
<body>
<div id="home">
<div style="display:flex;justify-content:space-between;margin-bottom:18px"><h1 style="font-size:28px;font-weight:800">Music</h1></div>
<div class="searchWrap"><input id="q" placeholder="Cari: Yoasobi, Ado..." value=""><button class="goBtn" onclick="searchYT()">GO</button></div>
<div id="list"><p style="text-align:center;opacity:.5;margin-top:40px">Cari lagu dulu 🎧</p></div>
</div>

<div id="mini" onclick="if(tracks.length) openFull()">
<div class="miniTop"><div style="display:flex;gap:12px;align-items:center"><img id="miniImg"><div><h4 id="miniTitle">Music V1.0.2</h4><p id="miniArtist" style="font-size:11px;opacity:.5">YouTube API Ready</p></div></div></div>
<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:11px;opacity:.5;margin-bottom:6px"><span id="mCur">0:00</span><span id="mDur">0:00</span></div><input type="range" id="miniSeek" value="0"></div>
<div class="miniCtrl" onclick="event.stopPropagation()">
<i class="fa-solid fa-backward-step" onclick="prev()"></i>
<div class="playPink" onclick="togglePlay()"><i id="miniPlay" class="fa-solid fa-play"></i></div>
<i class="fa-solid fa-forward-step" onclick="next()"></i>
</div>
</div>

<div id="full">
<div id="bg"></div>
<div style="position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:22px 16px"><i class="fa-solid fa-chevron-down" onclick="closeFull()" style="font-size:20px"></i><div style="display:flex;gap:14px"><b id="tabSong" onclick="switchTab('song')" style="border-bottom:2px solid #fff">Song</b><span style="opacity:.3">|</span><span id="tabLyrics" onclick="switchTab('lyrics')" style="opacity:.5">Lyrics</span></div><i class="fa-solid fa-ellipsis-vertical"></i></div>
<div id="slider"><div class="panel"></div><div class="panel"><div id="lyrics" class="lyricBox">Pilih lagu untuk mulai. Kalau ada iklan, thumbnail & durasi akan ganti otomatis jadi iklan.</div></div></div>
<div id="queue"><h3 style="display:flex;justify-content:space-between">Queue <i class="fa-solid fa-xmark" onclick="queue.classList.remove('active')"></i></h3><div id="queueList" style="margin-top:16px"></div></div>
<div class="bottom">
<div style="display:flex;justify-content:space-between"><div><h2 id="fTitle" style="font-size:19px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">- <span id="adBadge">AD</span></h2><p id="fArtist" style="font-size:13px;opacity:.6">-</p><p id="fStatus" style="font-size:10px;color:#4ade80;margin-top:4px"></p></div><div style="display:flex;gap:18px;font-size:22px"><i class="fa-solid fa-list-ul" onclick="queue.classList.add('active')"></i></div></div>
<div style="margin-top:18px"><input type="range" id="seek" value="0"><div style="display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:6px"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:0 8px"><i class="fa-solid fa-backward-step" style="font-size:22px;width:42px;height:42px;display:flex;justify-content:center;align-items:center" onclick="prev()"></i><div onclick="togglePlay()" style="width:70px;height:70px;background:#fff;color:#000;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:28px;margin:0 6px"><i id="pIcon" class="fa-solid fa-play"></i></div><i class="fa-solid fa-forward-step" style="font-size:22px;width:42px;height:42px;display:flex;justify-content:center;align-items:center" onclick="next()"></i></div>
</div>
</div>
<div id="yt-player" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API_KEY='AIzaSyCuKx7zWsOGiyegFVsS35Yr77NYtLgyY34';
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,'0')};
let player, tracks=[], idx=0, isAdPlaying=false, originalData=null, isDragging=false;
const q=document.getElementById('q'), list=document.getElementById('list'), queueList=document.getElementById('queueList');
const fTitle=document.getElementById('fTitle'), fArtist=document.getElementById('fArtist'), fStatus=document.getElementById('fStatus'), bg=document.getElementById('bg');
const miniTitle=document.getElementById('miniTitle'), miniArtist=document.getElementById('miniArtist'), miniImg=document.getElementById('miniImg');
const lyricsDiv=document.getElementById('lyrics'), cur=document.getElementById('cur'), dur=document.getElementById('dur'), mCur=document.getElementById('mCur'), mDur=document.getElementById('mDur');
const seek=document.getElementById('seek'), miniSeek=document.getElementById('miniSeek'), pIcon=document.getElementById('pIcon'), miniPlay=document.getElementById('miniPlay');
const adBadge=document.getElementById('adBadge');
function switchTab(t){ const slider=document.getElementById('slider'); if(t==='lyrics'){ slider.style.transform='translateX(-50%)'; document.getElementById('tabSong').style.opacity=.5; document.getElementById('tabSong').style.borderBottom='none'; document.getElementById('tabLyrics').style.opacity=1; document.getElementById('tabLyrics').style.borderBottom='2px solid #fff'; document.getElementById('full').classList.add('lyrics-mode'); }else{ slider.style.transform='translateX(0)'; document.getElementById('tabLyrics').style.opacity=.5; document.getElementById('tabLyrics').style.borderBottom='none'; document.getElementById('tabSong').style.opacity=1; document.getElementById('tabSong').style.borderBottom='2px solid #fff'; document.getElementById('full').classList.remove('lyrics-mode'); } }
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{height:'1',width:'1',videoId:'',playerVars:{playsinline:1,origin:location.origin},events:{
    onReady:()=>{
      setInterval(()=>{
        if(!player || !player.getDuration || isDragging) return;
        try{
          const vd=player.getVideoData();
          const isAd=vd && vd.isAd;
          const curTime=player.getCurrentTime()||0;
          const duration=player.getDuration()||0;
          if(isAd){
            if(!isAdPlaying){
              isAdPlaying=true;
              originalData={fTitle:fTitle.textContent,fArtist:fArtist.textContent,miniTitle:miniTitle.textContent,miniArtist:miniArtist.textContent,bg:bg.style.backgroundImage,miniImg:miniImg.src,lyrics:lyricsDiv.textContent};
              const adId=vd.video_id; const adTitle=vd.title||'Iklan';
              const adThumb=`https://i.ytimg.com/vi/${adId}/hqdefault.jpg`;
              adBadge.classList.add('show');
              fTitle.innerHTML=`${adTitle} <span id="adBadge" class="show">AD</span>`;
              fArtist.textContent='Sedang memutar iklan • '+fmt(duration);
              fStatus.textContent='AD • Preview Iklan'; fStatus.style.color='#ffcc00';
              miniTitle.textContent='Iklan: '+adTitle; miniArtist.textContent='Sedang memutar iklan...';
              miniImg.src=adThumb; bg.style.backgroundImage=`url('${adThumb}')`;
              lyricsDiv.textContent=`Sedang memutar IKLAN:\n${adTitle}\n\nThumbnail: ${adThumb}\n\nDurasi iklan: ${fmt(duration)}\nAkan balik ke lagu setelah iklan.`;
              lyricsDiv.classList.add('ad-mode');
            }
          }else{
            if(isAdPlaying){
              isAdPlaying=false; adBadge.classList.remove('show');
              if(originalData){
                fTitle.textContent=originalData.fTitle; fArtist.textContent=originalData.fArtist;
                miniTitle.textContent=originalData.miniTitle; miniArtist.textContent=originalData.miniArtist;
                miniImg.src=originalData.miniImg; bg.style.backgroundImage=originalData.bg;
                lyricsDiv.textContent=originalData.lyrics; lyricsDiv.classList.remove('ad-mode');
                fStatus.textContent='Playing'; fStatus.style.color='#4ade80';
              }
            }
          }
          if(duration>0){
            const pct=(curTime/duration)*100; seek.value=pct; miniSeek.value=pct;
            cur.textContent=fmt(curTime); mCur.textContent=fmt(curTime);
            dur.textContent=fmt(duration); mDur.textContent=fmt(duration);
          }
        }catch(e){}
      },400);
    },
    onStateChange:e=>{
      const playing=e.data==1;
      pIcon.className=playing?'fa-solid fa-pause':'fa-solid fa-play';
      miniPlay.className=pIcon.className;
      if(e.data==0 && !isAdPlaying) next();
    }
  }});
}
async function searchYT(){
  const query=q.value.trim(); if(!query) return;
  list.innerHTML='<p style="text-align:center;opacity:.5;margin-top:20px">Searching YouTube Data API v3...</p>';
  try{
    const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q=${encodeURIComponent(query)}&key=${API_KEY}`);
    const data=await res.json(); if(data.error) throw new Error(data.error.message);
    tracks=data.items.map(it=>({id:it.id.videoId,title:it.snippet.title,ch:it.snippet.channelTitle,image:it.snippet.thumbnails.high?.url||`https://i.ytimg.com/vi/${it.id.videoId}/hqdefault.jpg`}));
    render();
  }catch(e){ list.innerHTML=`<p style="color:#ff5a5a;text-align:center">${e.message}</p>`; }
}
function render(){
  list.innerHTML=''; queueList.innerHTML='';
  tracks.forEach((t,i)=>{
    const d=document.createElement('div'); d.className='cardHome';
    d.innerHTML=`<img src="${t.image}"><div style="flex:1"><h4 style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">${t.title}</h4><p style="font-size:11px;opacity:.5">${t.ch}</p></div>`;
    d.onclick=()=>playFull(i); list.appendChild(d);
    const qd=d.cloneNode(true); qd.onclick=()=>playFull(i); queueList.appendChild(qd);
  });
}
function playFull(i){
  idx=i; const t=tracks[i];
  fTitle.textContent=t.title; fArtist.textContent=t.ch; miniTitle.textContent=t.title; miniArtist.textContent=t.ch; miniImg.src=t.image; bg.style.backgroundImage=`url('${t.image}')`;
  fStatus.textContent='Loading...'; lyricsDiv.textContent=`Sedang memutar: ${t.title}\nChannel: ${t.ch}\nJika ada iklan, thumbnail & durasi akan ganti jadi iklan.`;
  document.getElementById('full').classList.add('active');
  if(player && player.loadVideoById) player.loadVideoById(t.id);
}
function openFull(){ if(tracks.length) document.getElementById('full').classList.add('active'); }
function closeFull(){ document.getElementById('full').classList.remove('active'); }
function togglePlay(){ if(!player) return; const st=player.getPlayerState(); if(st==1) player.pauseVideo(); else player.playVideo(); }
function next(){ if(!tracks.length) return; idx=(idx+1)%tracks.length; playFull(idx); }
function prev(){ if(!tracks.length) return; idx=(idx-1+tracks.length)%tracks.length; playFull(idx); }
function setupSeek(el){ el.addEventListener('input',()=>isDragging=true); el.addEventListener('change',()=>{ const pct=parseFloat(el.value); if(player && player.getDuration){ player.seekTo(pct/100*player.getDuration(),true); } isDragging=false; }); }
setupSeek(seek); setupSeek(miniSeek);
q.addEventListener('keydown',e=>{ if(e.key==='Enter') searchYT(); });
</script>
</body>
</html>
